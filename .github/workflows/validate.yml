name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.300
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the marketplace, plugin and skill
        run: claude plugin validate . --strict
      - name: Validate the Cursor manifests against Cursor's schemas
        env:
          SCHEMAS: https://raw.githubusercontent.com/cursor/plugins/e5136d82418d2db3165ea1050d17577cd618cc05/schemas
        run: |
          pipx run --spec check-jsonschema==0.38.2 check-jsonschema --schemafile "$SCHEMAS/plugin.schema.json" .cursor-plugin/plugin.json
          pipx run --spec check-jsonschema==0.38.2 check-jsonschema --schemafile "$SCHEMAS/marketplace.schema.json" .cursor-plugin/marketplace.json
      - name: The plugin points only at the pebblebase MCP URL
        run: |
          expected='{"mcpServers":{"pebblebase":{"type":"http","url":"https://mcp.pebblebase.dev/mcp"}}}'
          test "$(jq -c . .mcp.json)" = "$expected"
          test "$(jq -c . mcp.json)" = "$expected"
          test "$(jq -r .mcpServers .cursor-plugin/plugin.json)" = ./mcp.json
      - name: Both manifests carry the same version
        run: test "$(jq -r .version .claude-plugin/plugin.json)" = "$(jq -r .version .cursor-plugin/plugin.json)"
